<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>地洞播放器 Windows 极简版</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='bg' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%230B1320'/%3E%3Cstop offset='1' stop-color='%23162B4D'/%3E%3C/linearGradient%3E%3ClinearGradient id='tri' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%2338BDF8'/%3E%3Cstop offset='1' stop-color='%2334D399'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='url(%23bg)'/%3E%3Ccircle cx='32' cy='32' r='22' fill='none' stroke='%2394A3B8' stroke-opacity='.4' stroke-width='2'/%3E%3Ccircle cx='32' cy='32' r='16' fill='none' stroke='%23E2E8F0' stroke-opacity='.65' stroke-width='2.4'/%3E%3Cpath d='M27 23.5c0-1.6 1.8-2.6 3.1-1.7l12.2 8.5c1.1.8 1.1 2.5 0 3.3l-12.2 8.5c-1.3.9-3.1-.1-3.1-1.7z' fill='url(%23tri)'/%3E%3C/svg%3E">
  <style>
    :root, [data-theme="ocean"] {
      color-scheme: dark;
      --bg: #0b1320;
      --bg-glow: rgba(56, 189, 248, .12);
      --panel: rgba(19, 30, 48, .92);
      --panel-2: #1c2a42;
      --input: #131e30;
      --line: rgba(148, 163, 184, .18);
      --text: #f1f5f9;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --accent-2: #34d399;
      --on-accent: #071320;
      --danger: #ff5a79;
      --stage-bg: #09101c;
    }
    [data-theme="apple_light"] {
      color-scheme: light;
      --bg: #f2f2f7;
      --bg-glow: rgba(0, 122, 255, .07);
      --panel: rgba(255, 255, 255, .92);
      --panel-2: #e9e9ef;
      --input: #f2f2f7;
      --line: rgba(60, 60, 67, .14);
      --text: #1c1c1e;
      --muted: #636366;
      --accent: #007aff;
      --accent-2: #34c759;
      --on-accent: #ffffff;
      --danger: #ff3b30;
      --stage-bg: #f8f8fc;
    }
    [data-theme="apple_dark"] {
      color-scheme: dark;
      --bg: #000000;
      --bg-glow: rgba(250, 45, 72, .12);
      --panel: rgba(28, 28, 30, .94);
      --panel-2: #2c2c2e;
      --input: #1c1c1e;
      --line: rgba(255, 255, 255, .12);
      --text: #f5f5f7;
      --muted: #aeaeb2;
      --accent: #fa2d48;
      --accent-2: #30d158;
      --on-accent: #ffffff;
      --danger: #ff453a;
      --stage-bg: #0c0c0e;
    }
    [data-theme="paper"] {
      color-scheme: light;
      --bg: #f6f0e4;
      --bg-glow: rgba(200, 109, 45, .09);
      --panel: rgba(253, 251, 247, .94);
      --panel-2: #ede3d1;
      --input: #f6f0e4;
      --line: rgba(110, 93, 77, .18);
      --text: #2b2118;
      --muted: #6e5d4d;
      --accent: #c86d2d;
      --accent-2: #2e8b78;
      --on-accent: #ffffff;
      --danger: #d94e4e;
      --stage-bg: #f3eadb;
    }
    [data-theme="amber"] {
      color-scheme: dark;
      --bg: #0c0805;
      --bg-glow: rgba(255, 180, 81, .12);
      --panel: rgba(24, 16, 9, .94);
      --panel-2: #221710;
      --input: #181009;
      --line: rgba(255, 180, 81, .16);
      --text: #f5ede2;
      --muted: #b3a08a;
      --accent: #ffb451;
      --accent-2: #4fd8c4;
      --on-accent: #140c05;
      --danger: #ff5a79;
      --stage-bg: #100905;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 18% 12%, var(--bg-glow), transparent 34%),
        var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Microsoft YaHei", "Segoe UI", sans-serif;
      transition: background .2s ease, color .2s ease;
    }
    button, input, select {
      font: inherit;
    }
    button {
      min-height: 36px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--panel-2);
      color: var(--text);
      cursor: pointer;
      padding: 7px 12px;
      transition: opacity .15s ease, border-color .15s ease, transform .1s ease;
    }
    button:hover { border-color: var(--accent); }
    button:active { transform: scale(.98); }
    button.primary {
      color: var(--on-accent);
      background: var(--accent);
      border-color: transparent;
      font-weight: 700;
      border-radius: 18px;
    }
    button.danger { color: var(--danger); }
    input[type="range"] { accent-color: var(--accent); }
    select, input[type="text"] {
      background: var(--input);
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 12px;
      min-height: 36px;
      padding: 6px 10px;
    }
    .app {
      display: grid;
      grid-template-columns: minmax(270px, 350px) 1fr minmax(260px, 330px);
      gap: 14px;
      padding: 14px;
      min-height: 100vh;
    }
    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 20px;
      overflow: hidden;
      backdrop-filter: blur(18px);
      box-shadow: 0 14px 36px rgba(0, 0, 0, .14);
    }
    .panel header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
    }
    h1, h2 {
      margin: 0;
      letter-spacing: -0.01em;
    }
    h1 { font-size: 19px; }
    h2 { font-size: 15px; }
    .subtle { color: var(--muted); font-size: 12px; }
    .stack { display: grid; gap: 10px; padding: 14px; }
    .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .row > button, .row > select { flex: 1 1 auto; }
    .hidden-input {
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
      position: absolute;
    }
    .folders, .tracks, .bg-list {
      display: grid;
      gap: 6px;
      max-height: 34vh;
      overflow: auto;
      padding-right: 3px;
    }
    .item {
      display: grid;
      gap: 3px;
      width: 100%;
      text-align: left;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: transparent;
      padding: 10px;
      color: var(--text);
    }
    .item.active {
      border-color: var(--accent);
      background: var(--bg-glow);
    }
    .item .name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .stage {
      display: grid;
      grid-template-rows: auto minmax(320px, 1fr) auto;
      min-height: calc(100vh - 28px);
    }
    .brand {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
    }
    .brand-left {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }
    .logo {
      width: 44px;
      height: 44px;
      border-radius: 13px;
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      background: linear-gradient(145deg, #0b1320, #162b4d);
      border: 1px solid rgba(56, 189, 248, .35);
      box-shadow: 0 6px 16px rgba(0, 0, 0, .25);
    }
    .logo svg { width: 32px; height: 32px; }
    .media-box {
      display: grid;
      place-items: center;
      padding: 18px;
      background:
        radial-gradient(circle at 80% 18%, var(--bg-glow), transparent 48%),
        var(--stage-bg);
      position: relative;
      overflow: hidden;
    }
    video, audio {
      width: 100%;
      max-height: 100%;
      outline: none;
    }
    video {
      height: min(62vh, 680px);
      object-fit: contain;
      background: #000;
      border-radius: 14px;
    }
    audio { max-width: 720px; }
    .cover {
      min-height: 260px;
      width: min(600px, 100%);
      display: grid;
      place-items: center;
      border-radius: 22px;
      border: 1px solid var(--line);
      background:
        radial-gradient(circle at 50% 45%, var(--bg-glow), transparent 62%),
        var(--panel);
      color: var(--text);
      font-size: 19px;
      font-weight: 600;
      text-align: center;
      padding: 28px;
    }
    .lyric {
      position: absolute;
      left: 24px;
      right: 24px;
      bottom: 22px;
      text-align: center;
      padding: 12px 16px;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 600;
      color: var(--text);
      background: var(--panel);
      border: 1px solid var(--line);
      backdrop-filter: blur(12px);
      white-space: pre-wrap;
    }
    .controls {
      display: grid;
      gap: 10px;
      padding: 14px 16px;
      border-top: 1px solid var(--line);
    }
    .progress-row {
      display: grid;
      grid-template-columns: 58px 1fr 58px;
      align-items: center;
      gap: 10px;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
      font-size: 12px;
    }
    .status-line {
      min-height: 20px;
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .reader-text {
      min-height: 170px;
      max-height: 36vh;
      overflow: auto;
      padding: 14px;
      border-radius: 14px;
      background: var(--input);
      border: 1px solid var(--line);
      line-height: 1.8;
      white-space: pre-wrap;
    }
    .reader-text mark {
      background: var(--bg-glow);
      color: var(--accent);
      border-radius: 4px;
      padding: 0 3px;
    }
    @media (max-width: 1100px) {
      .app { grid-template-columns: 1fr; }
      .stage { min-height: 640px; }
      .folders, .tracks, .bg-list { max-height: 240px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="panel">
      <header>
        <h2>媒体库</h2>
        <span class="subtle" id="libraryCount">0 个文件</span>
      </header>
      <div class="stack">
        <input id="folderPicker" class="hidden-input" type="file" webkitdirectory multiple>
        <input id="filePicker" class="hidden-input" type="file" multiple accept="audio/*,video/*,.mp3,.flac,.wav,.m4a,.aac,.ogg,.mp4,.mkv,.mov,.avi,.webm">
        <div class="row">
          <button class="primary" id="pickFolder">扫描文件夹</button>
          <button id="pickFiles">打开文件</button>
        </div>
        <input id="search" type="text" placeholder="搜索当前列表">
        <select id="folderSelect"></select>
        <div class="folders" id="folderList"></div>
        <div class="tracks" id="trackList"></div>
      </div>
    </aside>

    <main class="panel stage">
      <section class="brand">
        <div class="brand-left">
          <div class="logo" aria-hidden="true">
            <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
              <defs>
                <linearGradient id="dlTri" x1="0" y1="0" x2="1" y2="1">
                  <stop offset="0" stop-color="#38BDF8"/>
                  <stop offset="1" stop-color="#34D399"/>
                </linearGradient>
              </defs>
              <circle cx="32" cy="32" r="24" fill="none" stroke="#94A3B8" stroke-opacity=".42" stroke-width="2.2"/>
              <circle cx="32" cy="32" r="17" fill="none" stroke="#E2E8F0" stroke-opacity=".72" stroke-width="2.6"/>
              <path d="M27 23.2c0-1.7 1.9-2.7 3.3-1.8l12.4 8.7c1.2.8 1.2 2.6 0 3.4l-12.4 8.7c-1.4.9-3.3-.1-3.3-1.8z" fill="url(#dlTri)"/>
            </svg>
          </div>
          <div>
            <h1>地洞播放器 Windows 版</h1>
            <div class="subtle" id="nowInfo">先扫描文件夹或打开文件</div>
          </div>
        </div>
        <select id="themeSelect" aria-label="选择主题" style="flex:0 0 auto;min-width:128px;">
          <option value="ocean">静谧深海</option>
          <option value="apple_light">Apple 极简白</option>
          <option value="apple_dark">Apple 午夜黑</option>
          <option value="paper">暖纸护眼</option>
          <option value="amber">树洞暖琥珀</option>
        </select>
      </section>
      <section class="media-box">
        <div class="cover" id="cover">树洞里有一只耳朵，正在等你的声音</div>
        <video id="video" controls hidden></video>
        <audio id="audio" controls hidden></audio>
        <div class="lyric" id="caption">暂无歌词 / 字幕</div>
      </section>
      <section class="controls">
        <div class="progress-row">
          <span id="currentTime">00:00</span>
          <input id="seek" type="range" min="0" max="1000" value="0">
          <span id="duration">00:00</span>
        </div>
        <div class="row">
          <button id="prev">上一首</button>
          <button class="primary" id="playPause">播放/暂停</button>
          <button id="next">下一首</button>
          <button id="fullscreen">全屏</button>
        </div>
        <div class="row">
          <button id="back15">快退15秒</button>
          <button id="forward30">快进30秒</button>
          <select id="speed"></select>
          <select id="repeat">
            <option value="order">顺序播放</option>
            <option value="one">单曲循环</option>
            <option value="list">列表循环</option>
          </select>
        </div>
        <div class="row">
          <button id="setA">设 A 点</button>
          <button id="setB">设 B 点</button>
          <button id="clearAb">清 AB</button>
          <span class="subtle" id="abState">AB 未设置</span>
        </div>
        <div class="status-line" id="status">准备就绪</div>
      </section>
    </main>

    <aside class="panel">
      <header>
        <h2>朗读 / 背景音乐</h2>
        <span class="subtle">本机浏览器语音</span>
      </header>
      <div class="stack">
        <input id="txtPicker" class="hidden-input" type="file" multiple accept=".txt,.md,.json">
        <input id="bgPicker" class="hidden-input" type="file" multiple accept="audio/*,.mp3,.flac,.wav,.m4a,.aac,.ogg">
        <div class="row">
          <button id="pickTxt">导入文本/书架</button>
          <button id="readToggle">朗读/暂停</button>
          <button id="readStop">停止朗读</button>
        </div>
        <div class="row">
          <select id="voiceSelect"></select>
          <select id="ttsRate">
            <option value="0.75">0.75x 慢速</option>
            <option value="1" selected>1.00x 正常</option>
            <option value="1.25">1.25x 稍快</option>
            <option value="1.5">1.50x 快速</option>
            <option value="1.75">1.75x 极快</option>
            <option value="2">2.00x 倍速</option>
          </select>
          <select id="ttsLoop">
            <option value="order">顺序连读</option>
            <option value="one">单本循环</option>
            <option value="all">书架循环</option>
            <option value="stop">读完停止</option>
          </select>
        </div>
        <div class="bg-list" id="bookList"></div>
        <div class="reader-text" id="readerText">导入 TXT / MD / JSON 后，这里会显示朗读文本。</div>
        <div class="row">
          <button id="pickBg">添加背景音乐</button>
          <button id="bgPlay">背景播放/暂停</button>
          <button id="bgNext">下一背景</button>
        </div>
        <div class="row">
          <label class="subtle">背景音量</label>
          <input id="bgVolume" type="range" min="0" max="100" value="25">
        </div>
        <div class="bg-list" id="bgList"></div>
      </div>
    </aside>
  </div>

  <script>
    const audio = document.getElementById('audio');
    const video = document.getElementById('video');
    const cover = document.getElementById('cover');
    const caption = document.getElementById('caption');
    const trackList = document.getElementById('trackList');
    const folderList = document.getElementById('folderList');
    const folderSelect = document.getElementById('folderSelect');
    const search = document.getElementById('search');
    const seek = document.getElementById('seek');
    const speed = document.getElementById('speed');
    const repeat = document.getElementById('repeat');
    const statusText = document.getElementById('status');
    const nowInfo = document.getElementById('nowInfo');
    const currentTime = document.getElementById('currentTime');
    const durationText = document.getElementById('duration');
    const libraryCount = document.getElementById('libraryCount');
    const readerText = document.getElementById('readerText');
    const voiceSelect = document.getElementById('voiceSelect');
    const ttsRateSelect = document.getElementById('ttsRate');
    const ttsLoopSelect = document.getElementById('ttsLoop');
    const bookList = document.getElementById('bookList');
    const bgList = document.getElementById('bgList');
    const bgAudio = new Audio();

    const audioExt = /\.(mp3|flac|wav|m4a|aac|ogg|opus|wma)$/i;
    const videoExt = /\.(mp4|mkv|mov|avi|webm|m4v|ts|flv|wmv)$/i;
    const memory = JSON.parse(localStorage.getItem('didongWindowsMemory') || '{}');
    let tracks = [];
    let folders = [];
    let currentFolder = '';
    let currentIndex = -1;
    let currentUrl = '';
    let currentKind = 'audio';
    let ab = { a: null, b: null };
    let readingBooks = [];
    let readingBookIndex = -1;
    let readingText = '';
    let readingKey = '';
    let readingOffset = 0;
    let readingPaused = true;
    let readingGeneration = 0;
    let bgTracks = [];
    let bgIndex = 0;

    if (memory.ttsRate) ttsRateSelect.value = String(memory.ttsRate);
    if (memory.ttsLoop) ttsLoopSelect.value = String(memory.ttsLoop);

    for (const value of [0.25, 0.5, 0.75, 1, 1.25, 1.5, 2, 3, 4, 6, 8]) {
      const option = document.createElement('option');
      option.value = value;
      option.textContent = value.toFixed(2) + 'x';
      if (value === 1) option.selected = true;
      speed.appendChild(option);
    }

    function saveMemory() {
      localStorage.setItem('didongWindowsMemory', JSON.stringify(memory));
    }

    function naturalNumber(name) {
      const match = String(name).match(/\d+/);
      return match ? Number(match[0]) : Number.MAX_SAFE_INTEGER;
    }

    function sortTracks(list) {
      return [...list].sort((a, b) => {
        const na = naturalNumber(a.name);
        const nb = naturalNumber(b.name);
        if (na !== nb) return na - nb;
        return a.name.localeCompare(b.name, 'zh-CN', { numeric: true });
      });
    }

    function mediaKey(track) {
      return [track.name, track.size, track.lastModified].join('|');
    }

    function folderKey(track) {
      return track.folder || '打开的文件';
    }

    function kindOf(file) {
      if (videoExt.test(file.name) || file.type.startsWith('video/')) return 'video';
      return 'audio';
    }

    function setStatus(text) {
      statusText.textContent = text;
    }

    function formatTime(value) {
      if (!Number.isFinite(value) || value < 0) value = 0;
      const total = Math.floor(value);
      const h = Math.floor(total / 3600);
      const m = Math.floor((total % 3600) / 60);
      const s = total % 60;
      return h ? `${h}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}` : `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    }

    function activePlayer() {
      return currentKind === 'video' ? video : audio;
    }

    function buildLibrary(files) {
      const next = Array.from(files)
        .filter(file => audioExt.test(file.name) || videoExt.test(file.name) || file.type.startsWith('audio/') || file.type.startsWith('video/'))
        .map(file => {
          const relative = file.webkitRelativePath || file.name;
          const parts = relative.split(/[\\/]/);
          parts.pop();
          return {
            file,
            name: file.name,
            folder: parts.join('/') || '打开的文件',
            size: file.size,
            lastModified: file.lastModified,
            kind: kindOf(file)
          };
        });
      tracks = sortTracks(next);
      folders = [...new Set(tracks.map(folderKey))];
      currentFolder = folders[0] || '';
      libraryCount.textContent = tracks.length + ' 个文件';
      renderFolders();
      renderTracks();
      if (tracks.length) {
        const remembered = memory.lastKey;
        const index = remembered ? tracks.findIndex(t => mediaKey(t) === remembered) : -1;
        playAt(index >= 0 ? index : tracks.findIndex(t => folderKey(t) === currentFolder));
      }
    }

    function renderFolders() {
      folderSelect.innerHTML = '';
      folderList.innerHTML = '';
      folders.forEach(folder => {
        const count = tracks.filter(t => folderKey(t) === folder).length;
        const option = document.createElement('option');
        option.value = folder;
        option.textContent = `${folder} (${count})`;
        folderSelect.appendChild(option);

        const button = document.createElement('button');
        button.className = 'item' + (folder === currentFolder ? ' active' : '');
        button.innerHTML = `<span class="name">${folder}</span><span class="subtle">${count} 个媒体</span>`;
        button.onclick = () => {
          currentFolder = folder;
          folderSelect.value = folder;
          renderFolders();
          renderTracks();
        };
        folderList.appendChild(button);
      });
      folderSelect.value = currentFolder;
    }

    function visibleTracks() {
      const q = search.value.trim().toLowerCase();
      return tracks.filter(t => folderKey(t) === currentFolder && (!q || t.name.toLowerCase().includes(q)));
    }

    function renderTracks() {
      trackList.innerHTML = '';
      visibleTracks().forEach(track => {
        const index = tracks.indexOf(track);
        const button = document.createElement('button');
        button.className = 'item' + (index === currentIndex ? ' active' : '');
        button.innerHTML = `<span class="name">${track.name}</span><span class="subtle">${track.kind === 'video' ? '视频' : '音频'} · ${folderKey(track)}</span>`;
        button.onclick = () => playAt(index);
        trackList.appendChild(button);
      });
    }

    function applyFolderSpeed(track) {
      const key = `speed:${folderKey(track)}:${track.kind}`;
      const remembered = memory[key] || 1;
      speed.value = String(remembered);
      audio.playbackRate = remembered;
      video.playbackRate = remembered;
    }

    function playAt(index) {
      if (index < 0 || index >= tracks.length) return;
      saveCurrentPosition();
      currentIndex = index;
      const track = tracks[index];
      currentKind = track.kind;
      currentFolder = folderKey(track);
      if (currentUrl) URL.revokeObjectURL(currentUrl);
      currentUrl = URL.createObjectURL(track.file);
      audio.pause();
      video.pause();
      audio.hidden = currentKind !== 'audio';
      video.hidden = currentKind !== 'video';
      cover.hidden = currentKind === 'video';
      const player = activePlayer();
      player.src = currentUrl;
      player.load();
      applyFolderSpeed(track);
      const pos = memory[`pos:${mediaKey(track)}`] || 0;
      player.onloadedmetadata = () => {
        if (pos > 3 && pos < player.duration - 3) player.currentTime = pos;
        player.play().catch(() => setStatus('浏览器拦截了自动播放，请点播放按钮'));
      };
      nowInfo.textContent = `${track.name} · ${folderKey(track)}`;
      memory.lastKey = mediaKey(track);
      saveMemory();
      ab = memory[`ab:${mediaKey(track)}`] || { a: null, b: null };
      updateAbState();
      renderFolders();
      renderTracks();
      setStatus('正在播放：' + track.name);
    }

    function saveCurrentPosition() {
      if (currentIndex < 0) return;
      const track = tracks[currentIndex];
      const player = activePlayer();
      if (Number.isFinite(player.currentTime)) memory[`pos:${mediaKey(track)}`] = player.currentTime;
      memory.lastKey = mediaKey(track);
      saveMemory();
    }

    function jump(delta) {
      const player = activePlayer();
      player.currentTime = Math.max(0, Math.min(player.duration || 0, player.currentTime + delta));
      saveCurrentPosition();
    }

    function nextTrack(step = 1) {
      const list = visibleTracks();
      if (!list.length) return;
      const current = tracks[currentIndex];
      let local = list.indexOf(current);
      if (local < 0) local = 0;
      let next = local + step;
      if (next >= list.length) {
        if (repeat.value !== 'list') return;
        next = 0;
      }
      if (next < 0) next = repeat.value === 'list' ? list.length - 1 : 0;
      playAt(tracks.indexOf(list[next]));
    }

    function updateAbState() {
      document.getElementById('abState').textContent = ab.a == null
        ? 'AB 未设置'
        : `A ${formatTime(ab.a)}${ab.b == null ? '' : ' / B ' + formatTime(ab.b)}`;
    }

    function tick() {
      const player = activePlayer();
      if (!player.paused && currentIndex >= 0) saveCurrentPosition();
      const dur = player.duration || 0;
      currentTime.textContent = formatTime(player.currentTime || 0);
      durationText.textContent = formatTime(dur);
      if (dur && !seek.matches(':active')) seek.value = Math.floor((player.currentTime / dur) * 1000);
      if (ab.a != null && ab.b != null && player.currentTime >= ab.b) player.currentTime = ab.a;
      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);

    function onEnded() {
      if (repeat.value === 'one') {
        const player = activePlayer();
        player.currentTime = 0;
        player.play();
      } else {
        nextTrack(1);
      }
    }
    audio.onended = onEnded;
    video.onended = onEnded;

    document.getElementById('pickFolder').onclick = () => document.getElementById('folderPicker').click();
    document.getElementById('pickFiles').onclick = () => document.getElementById('filePicker').click();
    document.getElementById('folderPicker').onchange = e => buildLibrary(e.target.files);
    document.getElementById('filePicker').onchange = e => buildLibrary(e.target.files);
    folderSelect.onchange = () => {
      currentFolder = folderSelect.value;
      renderFolders();
      renderTracks();
    };
    search.oninput = renderTracks;
    document.getElementById('playPause').onclick = () => {
      const player = activePlayer();
      if (player.paused) player.play(); else player.pause();
    };
    document.getElementById('prev').onclick = () => nextTrack(-1);
    document.getElementById('next').onclick = () => nextTrack(1);
    document.getElementById('back15').onclick = () => jump(-15);
    document.getElementById('forward30').onclick = () => jump(30);
    document.getElementById('fullscreen').onclick = () => {
      const player = activePlayer();
      if (player.requestFullscreen) player.requestFullscreen();
    };
    seek.onchange = () => {
      const player = activePlayer();
      if (player.duration) player.currentTime = (Number(seek.value) / 1000) * player.duration;
    };
    speed.onchange = () => {
      const value = Number(speed.value);
      audio.playbackRate = value;
      video.playbackRate = value;
      if (currentIndex >= 0) memory[`speed:${currentFolder}:${currentKind}`] = value;
      saveMemory();
    };
    repeat.onchange = () => {
      memory.repeat = repeat.value;
      saveMemory();
    };
    repeat.value = memory.repeat || 'order';
    document.getElementById('setA').onclick = () => {
      ab.a = activePlayer().currentTime || 0;
      if (ab.b != null && ab.b <= ab.a) ab.b = null;
      if (currentIndex >= 0) memory[`ab:${mediaKey(tracks[currentIndex])}`] = ab;
      saveMemory();
      updateAbState();
    };
    document.getElementById('setB').onclick = () => {
      if (ab.a == null) ab.a = 0;
      ab.b = Math.max(ab.a + 1, activePlayer().currentTime || 0);
      if (currentIndex >= 0) memory[`ab:${mediaKey(tracks[currentIndex])}`] = ab;
      saveMemory();
      updateAbState();
    };
    document.getElementById('clearAb').onclick = () => {
      ab = { a: null, b: null };
      if (currentIndex >= 0) delete memory[`ab:${mediaKey(tracks[currentIndex])}`];
      saveMemory();
      updateAbState();
    };

    function loadVoices() {
      const voices = speechSynthesis.getVoices();
      voiceSelect.innerHTML = '';
      voices.forEach((voice, index) => {
        const option = document.createElement('option');
        option.value = index;
        option.textContent = `${voice.name} · ${voice.lang}`;
        voiceSelect.appendChild(option);
      });
    }
    loadVoices();
    speechSynthesis.onvoiceschanged = loadVoices;

    document.getElementById('pickTxt').onclick = () => document.getElementById('txtPicker').click();
    document.getElementById('txtPicker').onchange = async e => {
      const files = Array.from(e.target.files || []);
      if (!files.length) return;
      let firstNewIndex = -1;
      for (const file of files) {
        const raw = await file.text();
        const text = file.name.toLowerCase().endsWith('.json') ? jsonToReadable(raw) : raw;
        const key = `read:${file.name}:${file.size}`;
        const existingIndex = readingBooks.findIndex(item => item.key === key);
        if (existingIndex >= 0) {
          readingBooks[existingIndex].text = text;
          if (firstNewIndex < 0) firstNewIndex = existingIndex;
        } else {
          readingBooks.push({ key, name: file.name, text });
          if (firstNewIndex < 0) firstNewIndex = readingBooks.length - 1;
        }
      }
      if (firstNewIndex >= 0) openReadingBook(firstNewIndex, !readingPaused);
      e.target.value = '';
    };

    function openReadingBook(index, autoStart) {
      if (index < 0 || index >= readingBooks.length) return;
      readingGeneration++;
      speechSynthesis.cancel();
      readingBookIndex = index;
      const book = readingBooks[index];
      readingText = book.text;
      readingKey = book.key;
      readingOffset = Math.max(0, Math.min(Number(memory[readingKey] || 0), Math.max(0, readingText.length - 1)));
      renderReadingBooks();
      showReadingText();
      setStatus(`当前文本：${book.name}`);
      if (autoStart) {
        pauseMediaForReading();
        readingPaused = false;
        speakNext();
      } else {
        readingPaused = true;
      }
    }

    function renderReadingBooks() {
      bookList.innerHTML = '';
      readingBooks.forEach((book, index) => {
        const button = document.createElement('button');
        button.className = 'item' + (index === readingBookIndex ? ' active' : '');
        const tag = index === readingBookIndex ? (readingPaused ? '当前' : '朗读中') : '书架';
        button.innerHTML = `<span class="name">${escapeHtml(book.name)}</span><span class="subtle">${tag}</span>`;
        button.onclick = () => openReadingBook(index, !readingPaused);
        bookList.appendChild(button);
      });
    }

    function pauseMediaForReading() {
      if (!audio.paused) audio.pause();
      if (!video.paused) video.pause();
    }

    function restartCurrentSentenceIfReading() {
      if (readingPaused || !readingText) return;
      readingGeneration++;
      speechSynthesis.cancel();
      speakNext();
    }

    ttsRateSelect.onchange = () => {
      memory.ttsRate = ttsRateSelect.value;
      saveMemory();
      setStatus(`朗读语速：${Number(ttsRateSelect.value).toFixed(2)}x`);
      restartCurrentSentenceIfReading();
    };
    voiceSelect.onchange = () => restartCurrentSentenceIfReading();
    ttsLoopSelect.onchange = () => {
      memory.ttsLoop = ttsLoopSelect.value;
      saveMemory();
      setStatus(`朗读模式：${ttsLoopSelect.options[ttsLoopSelect.selectedIndex].text}`);
    };

    function jsonToReadable(raw) {
      try {
        const value = JSON.parse(raw);
        const lines = [];
        const walk = data => {
          if (Array.isArray(data)) data.forEach(walk);
          else if (data && typeof data === 'object') Object.values(data).forEach(walk);
          else if (data != null && String(data).trim()) lines.push(String(data).trim());
        };
        walk(value);
        return lines.join('\n');
      } catch {
        return raw;
      }
    }

    function showReadingText(highlightLength = 0) {
      if (!readingText) {
        readerText.textContent = '导入 TXT / MD / JSON 后，这里会显示朗读文本。';
        return;
      }
      const start = Math.max(0, readingOffset - 160);
      const end = Math.min(readingText.length, readingOffset + 520);
      const before = escapeHtml(readingText.slice(start, readingOffset));
      const current = escapeHtml(readingText.slice(readingOffset, readingOffset + highlightLength));
      const after = escapeHtml(readingText.slice(readingOffset + highlightLength, end));
      readerText.innerHTML = before + (current ? `<mark>${current}</mark>` : '') + after;
      readerText.scrollTop = readerText.scrollHeight / 3;
    }

    function escapeHtml(text) {
      return text.replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
    }

    function handleReadingBookEnded() {
      if (readingKey) {
        memory[readingKey] = 0;
        saveMemory();
      }
      const mode = ttsLoopSelect.value || 'order';
      if (mode === 'one') {
        readingOffset = 0;
        showReadingText();
        speakNext();
        return;
      }
      if (mode === 'stop') {
        readingOffset = 0;
        readingPaused = true;
        renderReadingBooks();
        showReadingText();
        setStatus('当前文本已读完并停止');
        return;
      }
      if (readingBookIndex >= 0 && readingBookIndex + 1 < readingBooks.length) {
        openReadingBook(readingBookIndex + 1, true);
        return;
      }
      if (mode === 'all' && readingBooks.length > 0) {
        openReadingBook(0, true);
        return;
      }
      readingOffset = 0;
      readingPaused = true;
      renderReadingBooks();
      showReadingText();
      setStatus('书架文本已全部朗读完成');
    }

    function speakNext() {
      if (!readingText) {
        readingPaused = true;
        renderReadingBooks();
        return;
      }
      if (readingOffset >= readingText.length) {
        handleReadingBookEnded();
        return;
      }
      const gen = ++readingGeneration;
      const text = readingText.slice(readingOffset, readingOffset + 420);
      const sentenceEnd = text.search(/[。！？!?；;\n]/);
      const chunk = text.slice(0, sentenceEnd > 40 ? sentenceEnd + 1 : Math.min(text.length, 420));
      const utterance = new SpeechSynthesisUtterance(chunk);
      const voices = speechSynthesis.getVoices();
      if (voices[voiceSelect.value]) utterance.voice = voices[voiceSelect.value];
      utterance.rate = Number(ttsRateSelect.value || 1);
      showReadingText(chunk.length);
      utterance.onboundary = event => {
        if (gen !== readingGeneration) return;
        if (typeof event.charIndex === 'number') showReadingText(Math.max(1, event.charLength || 1));
      };
      utterance.onend = () => {
        if (gen !== readingGeneration) return;
        readingOffset += chunk.length;
        if (readingKey) memory[readingKey] = readingOffset;
        memory.lastReadingOffset = readingOffset;
        saveMemory();
        showReadingText();
        if (!readingPaused) speakNext();
      };
      speechSynthesis.speak(utterance);
    }

    document.getElementById('readToggle').onclick = () => {
      if (!readingText) return;
      if (!readingPaused) {
        readingPaused = true;
        readingGeneration++;
        speechSynthesis.cancel();
        renderReadingBooks();
      } else {
        pauseMediaForReading();
        readingPaused = false;
        renderReadingBooks();
        speakNext();
      }
    };
    document.getElementById('readStop').onclick = () => {
      readingPaused = true;
      readingGeneration++;
      speechSynthesis.cancel();
      readingOffset = 0;
      if (readingKey) {
        memory[readingKey] = 0;
        saveMemory();
      }
      renderReadingBooks();
      showReadingText();
    };

    document.getElementById('pickBg').onclick = () => document.getElementById('bgPicker').click();
    document.getElementById('bgPicker').onchange = e => {
      bgTracks = Array.from(e.target.files).map(file => ({ file, name: file.name, url: URL.createObjectURL(file) }));
      bgIndex = 0;
      renderBg();
      if (bgTracks.length) playBg(0);
    };
    document.getElementById('bgPlay').onclick = () => {
      if (!bgTracks.length) return;
      if (bgAudio.paused) bgAudio.play(); else bgAudio.pause();
    };
    document.getElementById('bgNext').onclick = () => playBg((bgIndex + 1) % Math.max(1, bgTracks.length));
    document.getElementById('bgVolume').oninput = e => {
      bgAudio.volume = Number(e.target.value) / 100;
      memory.bgVolume = e.target.value;
      saveMemory();
    };
    document.getElementById('bgVolume').value = memory.bgVolume || 25;
    bgAudio.volume = Number(document.getElementById('bgVolume').value) / 100;
    bgAudio.onended = () => playBg((bgIndex + 1) % Math.max(1, bgTracks.length));

    function playBg(index) {
      if (!bgTracks.length) return;
      bgIndex = index;
      bgAudio.src = bgTracks[bgIndex].url;
      bgAudio.play();
      renderBg();
    }

    function renderBg() {
      bgList.innerHTML = '';
      bgTracks.forEach((track, index) => {
        const button = document.createElement('button');
        button.className = 'item' + (index === bgIndex ? ' active' : '');
        button.innerHTML = `<span class="name">${track.name}</span><span class="subtle">背景音乐</span>`;
        button.onclick = () => playBg(index);
        bgList.appendChild(button);
      });
    }

    const themeSelect = document.getElementById('themeSelect');
    const savedTheme = localStorage.getItem('didong_web_theme') || 'ocean';
    document.documentElement.setAttribute('data-theme', savedTheme);
    if (themeSelect) {
      themeSelect.value = savedTheme;
      themeSelect.onchange = () => {
        document.documentElement.setAttribute('data-theme', themeSelect.value);
        localStorage.setItem('didong_web_theme', themeSelect.value);
      };
    }

    window.addEventListener('beforeunload', saveCurrentPosition);
  </script>
</body>
</html>
